# ============================================================
# 本地博客预览站 —— Halo + PostgreSQL（与线上 zanecarter.top 同款架构）
# ------------------------------------------------------------
# 启动：docker compose up -d    停止：docker compose down
# 浏览器访问 http://localhost:8090
# ============================================================
services:

  # ============ ① 数据库服务（PostgreSQL 15，线上同款） ============
  halodb:
    image: docker.m.daocloud.io/library/postgres:15.4   # 镜像：走国内加速器（Docker Hub 直连太慢）
    container_name: halo-preview-db
    restart: unless-stopped                 # 崩溃/重启后自动拉起
    environment:                            # 环境变量 = 告诉 PostgreSQL 怎么初始化
      POSTGRES_USER: halo                   #   建一个用户叫 halo
      POSTGRES_PASSWORD: halo123456         #   密码（仅本地测试用）
      POSTGRES_DB: halo                     #   自动创建名为 halo 的数据库
    volumes:
      - ./pg-data:/var/lib/postgresql/data  # 数据卷：数据库文件存宿主机 pg-data/
    healthcheck:                            # 健康检查：让 Halo 知道"我准备好了"
      test: ["CMD-SHELL", "pg_isready -U halo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============ ② 博客主程序（Halo 2.20.21，和线上同版本） ============
  halo:
    image: halohub/halo:2.20.21
    container_name: halo-preview
    restart: unless-stopped
    depends_on:                             # 依赖关系：等数据库健康后再启动
      halodb:
        condition: service_healthy
    ports:
      - "8090:8090"                         # 端口映射：浏览器访问 localhost:8090
    environment:
      # 开发专用：关闭模板缓存，改模板文件刷新即生效
      SPRING_THYMELEAF_CACHE: "false"
      # ↓↓↓ 数据库连接配置（和线上完全一样的写法） ↓↓↓
      SPRING_R2DBC_URL: "r2dbc:pool:postgresql://halodb/halo"   # 地址：halodb 就是数据库容器的"名字"
      SPRING_R2DBC_USERNAME: halo
      SPRING_R2DBC_PASSWORD: halo123456
      SPRING_SQL_INIT_PLATFORM: postgresql
    volumes:
      - ./halo-data:/root/.halo2                # Halo 工作目录（配置/日志/主题）
      - .:/root/.halo2/themes/theme-kukuxin      # 主题源码热挂载（改代码即生效）
