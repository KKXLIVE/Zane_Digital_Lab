<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(head = null,content = ~{::content})}">
<th:block th:fragment="content">
  <div class="lh">
    <span class="lh-badge" data-i18n-key="tags_badge">标签云</span>
    <h1 class="lh-title" data-i18n-key="tags_title">所有标签</h1>
    <p class="lh-count"
       data-i18n-key="tags_count"
       th:attr="data-i18n-param-n=${#lists.size(tags)}"
       th:text="'共 ' + ${#lists.size(tags)} + ' 个标签'"></p>
  </div>
  <div class="tagcloud-wrap">
    <div class="tagcloud" id="tagCloud">
      <a class="tagcloud-item"
         th:each="tag : ${tags}"
         th:href="@{${tag.status.permalink}}"
         th:text="${tag.spec.displayName}"
         th:attr="data-weight=${tag.status.postCount ?: 1}">tag</a>
    </div>
  </div>
</th:block>
</html>
