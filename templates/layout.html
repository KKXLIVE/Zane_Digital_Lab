<!DOCTYPE html>
<html lang="zh-CN"
      xmlns:th="https://www.thymeleaf.org"
      th:fragment="html (head,content)">
<head th:with="pageTitle=${#strings.defaultString(title, site.title)}">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" th:content="${theme.config?.seo?.meta_description} ?: 'KukuXin'" />
  <link rel="icon" th:href="${site.favicon}" />
  <title th:utext="${pageTitle}">KukuXin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/assets/css/style.css?v={version}(version=${theme.spec.version})}" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script th:inline="javascript">
    /*<![CDATA[*/
    (function(){
      var configTheme = /*[[${theme.config?.theme_mode_group?.theme_mode}]]*/ 'system';
      var stored = localStorage.getItem('aurora-theme');
      var theme;
      if (stored) {
        theme = stored;
      } else if (configTheme === 'system' || !configTheme) {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } else {
        theme = configTheme === 'dark' ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
    /*]]>*/
  </script>
  <th:block th:if="${head != null}"><th:block th:replace="${head}" /></th:block>
</head>
<body>
  <nav class="nv" id="nv">
    <div class="nv-inner">
      <a class="nv-logo" th:href="@{/}" th:text="${site.title}">KukuXin</a>
      <div class="nv-menu" id="nvMenu">
        <!-- 搜索按钮 -->
        <div th:if="${pluginFinder.available('PluginSearchWidget')}" class="nv-search" onclick="SearchWidget.open()" title="搜索">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>

        <!-- 主导航菜单（支持子菜单） -->
        <th:block th:with="primaryMenu = ${menuFinder.getPrimary()}">
          <th:block th:if="${primaryMenu != null and primaryMenu.menuItems != null}">
            <div th:each="m : ${primaryMenu.menuItems}" class="nv-menu-item" th:classappend="${m.children != null and !#lists.isEmpty(m.children)} ? 'has-sub' : ''">
              <a th:href="@{${m.status.href}}" th:text="${m.status.displayName}" th:attr="target=${m.spec.target == '_blank' ? '_blank' : _null}">Nav</a>
              <span th:if="${m.children != null and !#lists.isEmpty(m.children)}" class="nv-menu-arrow">
                <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </span>
              <div th:if="${m.children != null and !#lists.isEmpty(m.children)}" class="nv-submenu">
                <a th:each="child : ${m.children}" th:href="@{${child.status.href}}" th:text="${child.status.displayName}" th:attr="target=${child.spec.target == '_blank' ? '_blank' : _null}">Sub</a>
              </div>
            </div>
          </th:block>
          <th:block th:unless="${primaryMenu != null and primaryMenu.menuItems != null}">
            <a th:each="m : ${menus}" th:href="@{${m.spec.href}}" th:text="${m.spec.displayName}">Nav</a>
          </th:block>
        </th:block>

        <!-- 语言切换（统一使用子菜单结构） -->
        <div class="nv-lang nv-menu-item has-sub" id="langDropdown">
          <button class="nv-lang-btn" id="langBtn" data-i18n-aria="lang_switch" aria-label="语言切换">
            <span class="nv-lang-flag" id="langFlag">🇨🇳</span>
            <span class="nv-lang-text" id="langText">中文</span>
            <span class="nv-menu-arrow nv-lang-arrow">
              <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </span>
          </button>
          <div class="nv-lang-menu nv-submenu" id="langMenu">
            <button class="nv-lang-opt" data-lang="zh-CN" onclick="switchLocale('zh-CN')"><span class="nv-lang-opt-flag">🇨🇳</span> 中文</button>
            <button class="nv-lang-opt" data-lang="en" onclick="switchLocale('en')"><span class="nv-lang-opt-flag">🇬🇧</span> English</button>
            <button class="nv-lang-opt" data-lang="ja" onclick="switchLocale('ja')"><span class="nv-lang-opt-flag">🇯🇵</span> 日本語</button>
            <button class="nv-lang-opt" data-lang="ko" onclick="switchLocale('ko')"><span class="nv-lang-opt-flag">🇰🇷</span> 한국어</button>
          </div>
        </div>
        <a th:if="${theme.config?.theme_mode_group?.show_login_btn != false}" href="/console" class="nv-login" target="_blank" rel="noopener" data-i18n-aria="login_btn" aria-label="登录后台">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </a>
        <button class="nv-theme" id="themeBtn" data-i18n-aria="theme_switch" aria-label="主题切换">
          <span class="icon-sun">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </span>
          <span class="icon-moon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
        </button>
      </div>
      <button class="nv-toggle" id="nvToggle" data-i18n-aria="menu_btn" aria-label="菜单">
        <span></span><span></span>
      </button>
    </div>
  </nav>

  <main>
    <th:block th:replace="${content}" />
  </main>

  <footer class="ft">
    <div class="ft-inner">
      <div class="ft-top">
        <div class="ft-brand">
          <span class="ft-name" th:text="${site.title}">KukuXin</span>
          <p class="ft-desc" data-i18n-key="leave_trace">在时间里留下痕迹</p>
          <div class="ft-author" th:if="${theme.config?.footer?.show_author != false}">
            <span class="ft-author-label" data-i18n-key="author_label">作者</span>
            <span class="ft-author-name" th:text="${site.title}">KKXLIVE</span>
          </div>
        </div>
        <div class="ft-nav">
          <a th:each="m : ${menus}" th:href="@{${m.spec.href}}" th:text="${m.spec.displayName}">Nav</a>
        </div>
      </div>
      <div class="ft-btm">
        <span th:text="'© ' + ${#dates.format(#dates.createNow(), 'yyyy')} + ' ' + ${site.title}">© 2026</span>
        <span class="ft-dot">·</span>
        <span><span data-i18n-key="powered_by">Powered by</span> <a href="https://halo.run" target="_blank" rel="noopener">Halo</a></span>
        <span class="ft-dot">·</span>
        <span><span data-i18n-key="theme_label">Theme</span> <a href="https://zanecarter.top/" target="_blank" rel="noopener">KukuXin</a></span>
        <th:block th:if="${theme.config?.footer?.icp_number ?: false}">
          <span class="ft-dot">·</span>
          <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" class="ft-icp">
            <img th:src="@{/assets/images/icp.webp}" alt="ICP" class="ft-badge-icon" />
            <span th:text="${theme.config?.footer?.icp_number}">ICP</span>
          </a>
        </th:block>
        <th:block th:if="${theme.config?.footer?.police_number ?: false}">
          <span class="ft-dot">·</span>
          <a th:href="'https://www.beian.gov.cn/portal/registerSystemInfo?recordcode=' + ${theme.config?.footer?.police_number}" target="_blank" rel="noopener" class="ft-police">
            <img th:src="@{/assets/images/gonganbeian.png}" alt="公安备案" class="ft-badge-icon" />
            <span th:text="${theme.config?.footer?.police_number}">公安备案</span>
          </a>
        </th:block>
        <th:block th:if="${theme.config?.footer?.custom_html ?: false}">
          <div class="ft-custom" th:utext="${theme.config?.footer?.custom_html}"></div>
        </th:block>
      </div>
    </div>
  </footer>

  <halo:footer />

  <script th:src="@{/assets/js/i18n.js?v={version}(version=${theme.spec.version})}"></script>
  <script th:src="@{/assets/js/main.js?v={version}(version=${theme.spec.version})}"></script>
</body>
</html>
