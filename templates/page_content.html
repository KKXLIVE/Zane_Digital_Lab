<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(head = null, content = ~{::content})}">
<th:block th:fragment="content">
  <div class="content-header">
    <div class="content-header-inner">
      <div class="content-header-bg" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <line x1="9" y1="10" x2="15" y2="10"/>
          <line x1="12" y1="7" x2="12" y2="13"/>
        </svg>
      </div>
      <h1 class="content-header-title" th:text="${singlePage.spec.title}">留言板</h1>
      <div class="content-header-meta" th:if="${singlePage.spec.publishTime} or ${singlePage.stats?.visit != null}">
        <span class="content-meta-item" th:if="${singlePage.spec.publishTime}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <time th:datetime="${singlePage.spec.publishTime}"
                th:attr="data-i18n-date=${singlePage.spec.publishTime}"
                th:text="${#temporals.format(singlePage.spec.publishTime, 'yyyy-MM-dd')}">日期</time>
        </span>
        <span class="content-meta-item" th:if="${singlePage.stats?.visit != null}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <span data-i18n-key="stats_views">访问量</span>: <span th:text="${singlePage.stats.visit}">0</span>
        </span>
      </div>
    </div>
  </div>

  <!-- 留言内容区域 -->
  <div class="content-body-area">
    <div class="content-body-card" th:if="${singlePage.content != null and singlePage.content.content != null and !#strings.isEmpty(singlePage.content.content)}">
      <div class="content-body-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </div>
      <div class="content-body-text post-body tp" th:utext="${singlePage.content.content}"></div>
    </div>
  </div>

  <!-- 留言区 — 评论卡片 -->
  <div class="content-comments-area" id="comments">
    <th:block th:if="${singlePage.metadata != null and singlePage.metadata.name != null}">
      <div class="content-comments-card">
        <div class="content-comments-header">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span data-i18n-key="comments_title">留言</span>
        </div>
        <th:block th:replace="~{modules/common/comment :: comment(title='评论区', haloComment=${ {group: 'content.halo.run', kind: 'SinglePage', name: singlePage.metadata.name} })}"></th:block>
      </div>
    </th:block>
  </div>
</th:block>
</html>
