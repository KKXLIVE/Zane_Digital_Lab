<th:block th:fragment="outdated-notice(post, theme)">
  <div
    th:if="${theme.config.post.outdated_notice?.enabled != false and post.spec.publishTime != null}"
    class="outdated-notice"
    th:with="
      thresholdDays = ${theme.config.post.outdated_notice?.days ?: 180},
      message = ${theme.config.post.outdated_notice?.message ?: '本文发布于 {days} 天前，内容可能已过时，请注意甄别。'}
    "
    th:data-publish-time="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd''T''HH:mm:ss')}"
    th:data-threshold="${thresholdDays}"
    th:data-message="${message}"
    style="display: none"
  >
    <span class="outdated-icon">⚠️</span>
    <span class="outdated-text"></span>
  </div>
  <script>
    (function () {
      var notice = document.querySelector(".outdated-notice");
      if (!notice) return;

      var publishTime = new Date(notice.dataset.publishTime).getTime();
      var threshold = parseInt(notice.dataset.threshold) || 180;
      var messageTemplate = notice.dataset.message;

      var now = Date.now();
      var daysPassed = Math.floor((now - publishTime) / (1000 * 60 * 60 * 24));

      if (daysPassed >= threshold) {
        var text = messageTemplate.replace("{days}", daysPassed);
        notice.querySelector(".outdated-text").textContent = text;
        notice.style.display = "";
      }
    })();
  </script>
</th:block>
