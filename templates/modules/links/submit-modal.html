<th:block
  th:fragment="submit-modal"
  th:if="${theme.config?.links?.enable_submit}"
>
<div id="link-submit-modal" class="link-submit-modal">
  <div class="link-submit-overlay" onclick="closeLinkSubmitModal()"></div>
  <div class="link-submit-content">
    <div class="link-submit-header">
      <div class="header-info">
        <div class="header-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </div>
        <div>
          <h3 data-i18n-key="links_submit_title">提交友链申请</h3>
          <p class="header-desc" data-i18n-key="links_submit_desc">填写你的网站信息，我会尽快审核</p>
        </div>
      </div>
      <button class="link-submit-close" onclick="closeLinkSubmitModal()" aria-label="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div id="submit-message" class="submit-message" style="display: none"></div>

    <form id="link-submit-form" class="link-submit-form" onsubmit="return false;">
      <div class="form-section">
        <div class="section-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span data-i18n-key="links_submit_basic">基本信息</span>
        </div>

        <div class="form-group">
          <label for="link-url"><span data-i18n-key="links_submit_url">网站地址</span> <span class="required">*</span></label>
          <div class="input-with-btn">
            <input type="url" id="link-url" name="url" placeholder="https://example.com" required />
            <button type="button" class="ls-btn fetch-btn" id="auto-fetch-btn" onclick="autoFetchSiteInfo()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3h.01M12 7h.01M12 11h.01M12 15h.01M12 19h.01"/><path d="M3 12h.01M7 12h.01M11 12h.01M15 12h.01M19 12h.01"/></svg>
              <span data-i18n-key="links_submit_autofill">自动填充</span>
            </button>
          </div>
          <p class="form-hint" data-i18n-key="links_submit_url_hint">输入网址后点击"自动填充"可自动获取网站信息</p>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="link-name"><span data-i18n-key="links_submit_name">网站名称</span> <span class="required">*</span></label>
            <input type="text" id="link-name" name="displayName" placeholder="我的博客" required />
          </div>

          <div class="form-group">
            <label for="link-logo"><span data-i18n-key="links_field_logo">网站图标</span></label>
            <input type="url" id="link-logo" name="logo" placeholder="https://example.com/logo.png" />
          </div>
        </div>

        <div class="form-group">
          <label for="link-desc"><span data-i18n-key="links_field_desc">网站描述</span></label>
          <textarea id="link-desc" name="description" rows="2" placeholder="一句话介绍你的网站"></textarea>
        </div>
      </div>

      <div class="form-section collapsible" id="moreOptions">
        <button type="button" class="section-title clickable" onclick="toggleMoreOptions(this)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
          <span><span data-i18n-key="links_submit_more_title">更多选项</span>（<span data-i18n-key="links_submit_optional">可选</span>）</span>
          <svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>

        <div class="section-content">
          <div class="form-row">
            <div class="form-group">
              <label for="link-page"><span data-i18n-key="links_submit_linkpage">友链页面</span></label>
              <input type="url" id="link-page" name="linkPageUrl" placeholder="https://example.com/links" />
            </div>

            <div class="form-group">
              <label for="link-rss">RSS <span data-i18n-key="links_field_rss">地址</span></label>
              <input type="url" id="link-rss" name="rssUrl" placeholder="https://example.com/rss.xml" />
            </div>
          </div>

          <div class="form-group" id="link-group-wrapper" style="display: none">
            <label for="link-group"><span data-i18n-key="links_submit_group">申请分组</span></label>
            <select id="link-group" name="groupName">
              <option value=""><span data-i18n-key="links_submit_default_group">默认分组</span></option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="section-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span data-i18n-key="links_submit_verify">验证信息</span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="link-email"><span data-i18n-key="links_submit_email">联系邮箱</span> <span class="required">*</span></label>
            <input type="email" id="link-email" name="email" placeholder="your@email.com" required />
            <p class="form-hint" data-i18n-key="links_submit_email_hint">用于接收审核结果通知</p>
          </div>

          <div
            th:if="${theme.config?.links?.verify_type == 'email' or theme.config?.links?.verify_type == null}"
            class="form-group"
            id="email-verify-group"
          >
            <label for="link-code"><span data-i18n-key="links_submit_code">邮箱验证码</span> <span class="required">*</span></label>
            <div class="input-with-btn">
              <input type="text" id="link-code" name="verifyCode" placeholder="请输入收到的验证码" />
              <button type="button" class="ls-btn" id="send-code-btn" onclick="sendVerifyCode(this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                <span data-i18n-key="links_submit_send">发送</span>
              </button>
            </div>
          </div>
        </div>

        <div th:if="${theme.config?.links?.verify_type == 'captcha'}" class="form-group" id="captcha-group">
          <label for="link-captcha"><span data-i18n-key="links_submit_captcha">图形验证码</span> <span class="required">*</span></label>
          <div class="captcha-row">
            <input type="text" id="link-captcha" name="captcha" placeholder="请输入图中字符" />
            <img id="captcha-img" class="captcha-img" alt="验证码" onclick="refreshCaptcha('')" title="点击刷新" />
          </div>
        </div>
      </div>
    </form>

    <div class="form-actions">
      <button type="button" class="ls-btn cancel-btn" onclick="closeLinkSubmitModal()" data-i18n-key="links_submit_cancel">取消</button>
      <button type="button" class="ls-btn primary submit-btn" id="submit-btn" onclick="handleLinkSubmit()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        <span data-i18n-key="links_submit_btn">提交申请</span>
      </button>
    </div>
  </div>
</div>
</th:block>
