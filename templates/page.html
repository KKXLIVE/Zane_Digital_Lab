<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(head = null,content = ~{::content})}">
<th:block th:fragment="content">
  <div class="page-card-wrap">
    <div class="page-card-inner">
      <!-- 页眉 -->
      <div class="page-card-head">
        <div class="page-card-head-icon" aria-hidden="true">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        <h1 class="page-card-title" th:text="${singlePage.spec.title}">页面</h1>
        <div class="page-card-meta" th:if="${singlePage.spec.publishTime} or ${singlePage.owner}">
          <span class="page-card-meta-item" th:if="${singlePage.owner}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span th:text="${singlePage.owner.displayName}">作者</span>
          </span>
          <span class="page-card-meta-item" th:if="${singlePage.spec.publishTime}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <time th:datetime="${singlePage.spec.publishTime}"
                  th:attr="data-i18n-date=${singlePage.spec.publishTime}"
                  th:text="${#temporals.format(singlePage.spec.publishTime, 'yyyy-MM-dd')}">日期</time>
          </span>
          <span class="page-card-meta-item" th:if="${singlePage.stats?.visit != null}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span data-i18n-key="stats_views">访问量</span>: <span th:text="${singlePage.stats.visit}">0</span>
          </span>
          <span class="page-card-meta-item" th:if="${singlePage.stats?.comment != null}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span th:text="${singlePage.stats.comment}">0</span> <span data-i18n-key="comments_title">评论</span>
          </span>
        </div>
      </div>

      <!-- 内容卡片 -->
      <div class="page-card-body" th:if="${singlePage.content != null and singlePage.content.content != null and !#strings.isEmpty(singlePage.content.content)}">
        <div class="post-body tp" th:utext="${singlePage.content.content}"></div>
      </div>

      <!-- 评论区 -->
      <th:block th:if="${singlePage.metadata != null and singlePage.metadata.name != null}">
        <div class="page-card-comments" id="comments">
          <div class="page-card-comments-hd">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span data-i18n-key="comments_title">评论区</span>
          </div>
          <th:block th:replace="~{modules/common/comment :: comment(title='评论区', haloComment=${ {group: 'content.halo.run', kind: 'SinglePage', name: singlePage.metadata.name} })}"></th:block>
        </div>
      </th:block>
    </div>
  </div>
</th:block>
</html>
