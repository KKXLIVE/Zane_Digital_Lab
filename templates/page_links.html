<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(head = null, content = ~{::content})}">
<th:block th:fragment="content">
  <div class="page-header links-custom-header">
    <div class="page-header-inner">
      <img th:if="${singlePage.spec.cover != null and singlePage.spec.cover != ''}"
           th:src="${singlePage.spec.cover}"
           class="page-cover"
           th:alt="${singlePage.spec.title}" />
      <h1 class="post-title" th:text="${singlePage.spec.title}">友链</h1>
    </div>
  </div>

  <div class="post-body tp" th:utext="${singlePage.content.content}"></div>

  <th:block th:if="${singlePage.metadata != null and singlePage.metadata.name != null}">
    <div class="post-comments" id="comments">
      <th:block th:replace="~{modules/common/comment :: comment(title='评论区', haloComment=${ {group: 'content.halo.run', kind: 'SinglePage', name: singlePage.metadata.name} })}"></th:block>
    </div>
  </th:block>
</th:block>
</html>
