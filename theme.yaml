      - name: 项目展示
        description: "展示个人项目与作品"
        screenshot: ""
        file: page_projects
      - name: 友情链接页
        description: "自定义友链展示页面"
        screenshot: ""
        file: page_links
      - name: 留言板
        description: "访客留言、交流与反馈"
        screenshot: ""
        file: page_content
